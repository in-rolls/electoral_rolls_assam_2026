[project]
name = "assam-rolls"
version = "0.1.0"
description = "Extract Assam 2026 electoral-roll metadata and elector lists from scanned PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
keywords = ["electoral-rolls", "india", "assam", "ocr", "elections", "polling-stations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "anthropic>=0.40",
    # electors/grid.py projects ink with it to find the rules and the text bands.
    "numpy>=1.24",
    "pillow>=10",
    "pyarrow>=15",
]

[project.optional-dependencies]
romanize = ["aksharamukha>=2.1"]
# Cloud Vision over application-default credentials, so no API key is needed.
gcp = ["google-auth>=2.30", "requests>=2.31"]
dev = [
    "pytest>=8",
    "black>=24",
    "isort>=5",
    "flake8>=7",
]

[project.urls]
Homepage = "https://github.com/in-rolls/electoral_rolls_assam_2026"
Documentation = "https://in-rolls.github.io/electoral_rolls_assam_2026/"
Repository = "https://github.com/in-rolls/electoral_rolls_assam_2026"
Issues = "https://github.com/in-rolls/electoral_rolls_assam_2026/issues"
Releases = "https://github.com/in-rolls/electoral_rolls_assam_2026/releases"

[project.scripts]
assam-rolls = "assam_rolls.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assam_rolls*", "electors*", "romanize*"]

[tool.setuptools.package-data]
assam_rolls = ["profiles/*.json"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
